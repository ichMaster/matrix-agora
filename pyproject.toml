[project]
name = "matrix-agora"
version = "4.2.0"
description = "A private Matrix room where the owner and two small LLM agents talk together"
requires-python = ">=3.12"
dependencies = [
    "matrix-nio>=0.25",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",  # zoneinfo in slim images has no system tz database (v3.2)
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
    "pyyaml>=6.0",  # the compose contract test (v3.2)
]
# the panel (v3.3) — its own image installs only this group; kept out of the agent image
panel = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "docker>=7.1",
    "tzdata>=2024.1",  # zoneinfo in the slim image (the panel installs only this group)
]


[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# TRY004 misfires on nio's response-object API (isinstance checks on returned
# values are how matrix-nio signals errors; TypeError would be wrong there).
ignore = ["TRY004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# starlette nags about httpx in its TestClient; harmless for our tests
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.uv]
default-groups = ["dev", "panel"]   # local and CI: everything; the images pick their own
