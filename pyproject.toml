[project]
name = "matrix-agora"
version = "0.4.0"
description = "A private Matrix room where the owner and two small LLM agents talk together"
requires-python = ">=3.12"
dependencies = [
    "matrix-nio>=0.25",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
