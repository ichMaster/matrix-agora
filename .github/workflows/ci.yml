# CI (v3.2): the same gates as the Mac on every push and PR, then the agent image.
# Publishing to GHCR uses GITHUB_TOKEN only — no paid API keys or other secrets exist in CI.
#   main push → :edge + :sha-<short>   (the server can run a phase before its release tag)
#   vA.B.C tag → :vA.B.C + :latest
# CI never deploys: a GitHub runner cannot reach the LAN — server/deploy.sh runs from the Mac.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: lint
        run: uv run ruff check .
      - name: tests (nio and Gemini mocked, no network)
        run: uv run pytest
      - name: compose gate
        run: REGISTRATION_TOKEN=dummy docker compose -f server/docker-compose.yml config -q

  image:
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ichmaster/matrix-agora-agent
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: agents/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
