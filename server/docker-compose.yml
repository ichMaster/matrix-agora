services:
  homeserver:
    # pinned to the digest of Continuwuity 26.9.1 (code review #1): upgrades are a conscious
    # edit of this line + deploy, never an implicit `pull`. Mirror registry: ghcr.io/continuwuity/continuwuity
    image: forgejo.ellis.link/continuwuation/continuwuity@sha256:c9c62bc5c0a641f3f713945c701b069c7bc30d2612b54d4a5de80a5be19d5420
    restart: unless-stopped
    ports:
      - "8008:8008"
    volumes:
      - db:/var/lib/continuwuity
    environment:
      CONTINUWUITY_SERVER_NAME: agora.lan        # CANNOT be changed without wiping the DB
      CONTINUWUITY_DATABASE_PATH: /var/lib/continuwuity
      CONTINUWUITY_ADDRESS: 0.0.0.0
      CONTINUWUITY_PORT: 8008
      CONTINUWUITY_ALLOW_FEDERATION: "false"     # fully closed off from the Matrix network
      CONTINUWUITY_ALLOW_ENCRYPTION: "false"     # no E2EE rooms at all — simpler for the bots
      CONTINUWUITY_ALLOW_REGISTRATION: "false"   # closed since v0.4 — only the admin creates accounts
      CONTINUWUITY_REGISTRATION_TOKEN: "${REGISTRATION_TOKEN}"
  ada:
    # one container per agent, the same image (v3.2); the TOML picks the agent
    image: ghcr.io/ichmaster/matrix-agora-agent:${AGENT_IMAGE_TAG:-latest}
    command: ["agents/ada.toml"]
    restart: unless-stopped
    init: true                                   # tini as PID 1: SIGTERM reaches python (code review #1)
    depends_on: [homeserver]
    env_file:
      - path: .env
        required: false
    environment:
      HOMESERVER: http://homeserver:8008         # the compose network; the LAN URL stays for dev mode
      TZ: ${TIMEZONE:-Europe/Kyiv}
    user: "1000:1000"                            # the host user: the bind-mounted state/ stays theirs
    volumes:
      - ../state:/app/state
    stop_grace_period: 30s                       # SIGTERM → the session summary, then SIGKILL

  bruno:
    # one container per agent, the same image (v3.2); the TOML picks the agent
    image: ghcr.io/ichmaster/matrix-agora-agent:${AGENT_IMAGE_TAG:-latest}
    command: ["agents/bruno.toml"]
    restart: unless-stopped
    init: true                                   # tini as PID 1: SIGTERM reaches python (code review #1)
    depends_on: [homeserver]
    env_file:
      - path: .env
        required: false
    environment:
      HOMESERVER: http://homeserver:8008         # the compose network; the LAN URL stays for dev mode
      TZ: ${TIMEZONE:-Europe/Kyiv}
    user: "1000:1000"                            # the host user: the bind-mounted state/ stays theirs
    volumes:
      - ../state:/app/state
    stop_grace_period: 30s                       # SIGTERM → the session summary, then SIGKILL

  usage-report:
    # the daily token report (v3.1.1), 07:00 in TIMEZONE → ~/matrix-agora/reports/usage/
    image: ghcr.io/ichmaster/matrix-agora-agent:${AGENT_IMAGE_TAG:-latest}
    entrypoint: ["python", "agents/usage_daily.py"]
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TIMEZONE:-Europe/Kyiv}
    user: "1000:1000"
    volumes:
      - ../state:/app/state:ro
      - ../reports:/app/reports

  panel:
    # the panel (v3.3, read-only): the stack's state, logs, memory and tokens behind PANEL_TOKEN, LAN only
    image: ghcr.io/ichmaster/matrix-agora-panel:${PANEL_IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    depends_on: [homeserver]
    ports:
      - "8090:8090"
    environment:                                 # only what it needs — never the agents' keys or passwords
      PANEL_TOKEN: ${PANEL_TOKEN:-}              # unset or short → the panel refuses to start
      PRICE_INPUT_PER_1M: ${PRICE_INPUT_PER_1M:-}
      PRICE_OUTPUT_PER_1M: ${PRICE_OUTPUT_PER_1M:-}
      TIMEZONE: ${TIMEZONE:-Europe/Kyiv}
      TZ: ${TIMEZONE:-Europe/Kyiv}
    user: "1000:1000"
    group_add: ["${DOCKER_GID:-999}"]            # the host's docker group: the socket is root:docker 0660
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../state:/app/state:ro
      - /etc/os-release:/host/os-release:ro

volumes:
  db:

# deploy-loop proven: v0.2 (AGORA-004)
