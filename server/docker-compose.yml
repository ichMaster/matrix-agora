    user: "1000:1000"                            # the host user: the bind-mounted state/ stays theirs
    volumes:
      - ../state:/app/state
    stop_grace_period: 30s                       # a creature writes no summary; the grace period stays

  claude:
    # v4.4 — Claude as itself, on the owner's Max subscription only: its own image (the Agent SDK) and its OWN env
    # file — never the shared .env, so no Gemini key, no other password and never an API key reach it
    image: ghcr.io/ichmaster/matrix-agora-agent-claude:${AGENT_IMAGE_TAG:-latest}
    command: ["agents/claude.toml"]
    restart: unless-stopped
    init: true                                   # tini as PID 1: SIGTERM reaches python (code review #1)
    depends_on: [homeserver]
    env_file:
      - path: claude.env
        required: false
      - path: voice.env                          # v5.3: ELEVENLABS_API_KEY — only the members who speak
        required: false
    environment:
      HOMESERVER: http://homeserver:8008
      TZ: ${TIMEZONE:-Europe/Kyiv}
      HOME: /tmp/claude                          # the CLI's home and config: a tmpfs, nothing survives a restart
      CLAUDE_CONFIG_DIR: /tmp/claude
      CLAUDE_WORKSPACE: /workspace
      # the room and the turn settings every agent computes from — interpolated from the shared .env, so Claude can
      # never drift from the others (v4.4 review #5); only these names, never a secret of the shared file
      ROOM_ID: ${ROOM_ID:-}
      OWNER: ${OWNER:-}
      TIMEZONE: ${TIMEZONE:-Europe/Kyiv}
      HISTORY_N: ${HISTORY_N:-40}
      REPLY_MAX_TOKENS: ${REPLY_MAX_TOKENS:-200}
      MAX_BOT_TURNS: ${MAX_BOT_TURNS:-3}
      OWNER_REPLIERS: ${OWNER_REPLIERS:-2}
      FALLBACK_S: ${FALLBACK_S:-30}
      BOT_REPLY_P: ${BOT_REPLY_P:-0.5}
      REPLY_DELAY_S: ${REPLY_DELAY_S:-4}
      BOT_WINDOW_S: ${BOT_WINDOW_S:-600}
      CAT_REACT_P: ${CAT_REACT_P:-0.3}
      CAT_PURR_P: ${CAT_PURR_P:-0.8}
      CLAUDE_HISTORY_N: ${CLAUDE_HISTORY_N:-150}   # v4.5: the philosopher's wider window
      CLAUDE_NEWS_EVERY_S: ${CLAUDE_NEWS_EVERY_S:-3600} # v4.5: a Guardian news item every hour…
      CLAUDE_NEWS_IDLE_S: ${CLAUDE_NEWS_IDLE_S:-300}    # …once the room has been quiet this long…
      CLAUDE_NEWS_PER_DAY: ${CLAUDE_NEWS_PER_DAY:-24}   # …at most so many a day…
      CLAUDE_NEWS_HOURS: ${CLAUDE_NEWS_HOURS:-09-01}    # …in these local hours
      CLAUDE_VOICE_ID: ${CLAUDE_VOICE_ID:-}        # v5.3: his voice and the speakers' share and budget
      VOICE_REPLY_P: ${VOICE_REPLY_P:-1.0}
      VOICE_MONTHLY_CHARS: ${VOICE_MONTHLY_CHARS:-200000}
    tmpfs:
      - /tmp/claude:uid=1000,gid=1000,mode=0700,size=64m   # bounded (review #7)
    user: "1000:1000"
    volumes:
      - ../state:/app/state
      - ../claude-workspace:/workspace           # v4.5: his own folder — the only place his tools may read or write
    stop_grace_period: 30s

  hermes:
    # v5.1 — Hermes, the herald: the shared agent image (ffmpeg inside); he reads Agora and digests it for the owner in
    # his own room — no turns, never a word in Agora. His own env file holds his password and the ElevenLabs key.
    image: ghcr.io/ichmaster/matrix-agora-agent:${AGENT_IMAGE_TAG:-latest}
    command: ["agents/hermes.toml"]
    restart: unless-stopped
    init: true                                   # tini as PID 1: SIGTERM reaches python (code review #1)
    depends_on: [homeserver]
    env_file:
      - path: .env
        required: false
      - path: hermes.env                         # HERMES_PASSWORD, DEEPGRAM_API_KEY — his alone
        required: false
      - path: voice.env                          # v5.3: ELEVENLABS_API_KEY — only the members who speak
        required: false
    environment:
      HOMESERVER: http://homeserver:8008         # the compose network; the LAN URL stays for dev mode
      TZ: ${TIMEZONE:-Europe/Kyiv}
    user: "1000:1000"                            # the host user: the bind-mounted state/ stays theirs
    volumes:
      - ../state:/app/state
    stop_grace_period: 30s

  usage-report:
    # the daily token report (v3.1.1), 07:00 in TIMEZONE → ~/matrix-agora/reports/usage/
    image: ghcr.io/ichmaster/matrix-agora-agent:${AGENT_IMAGE_TAG:-latest}
    entrypoint: ["python", "agents/usage_daily.py"]
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TIMEZONE:-Europe/Kyiv}
    user: "1000:1000"
    volumes:
      - ../state:/app/state:ro
      - ../reports:/app/reports

  panel:
    # the panel (v3.3 views, v3.4 actions): the stack's state, logs, memory and tokens behind PANEL_TOKEN, LAN only
    image: ghcr.io/ichmaster/matrix-agora-panel:${PANEL_IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    depends_on: [homeserver]
    ports:                                       # the LAN address only: docker bypasses ufw (code review #1)
      - "${PANEL_BIND:-127.0.0.1}:8090:8090"     # unset → loopback: fails closed
    environment:                                 # only what it needs — never the agents' keys or passwords
      PANEL_TOKEN: ${PANEL_TOKEN:-}              # unset or short → the panel refuses to start
      PRICE_INPUT_PER_1M: ${PRICE_INPUT_PER_1M:-}
      PRICE_OUTPUT_PER_1M: ${PRICE_OUTPUT_PER_1M:-}
      PRICE_MODELS: ${PRICE_MODELS:-}            # v5.1: a model's own price pair (Hermes's Pro calls)
      TIMEZONE: ${TIMEZONE:-Europe/Kyiv}
      TZ: ${TIMEZONE:-Europe/Kyiv}
      STACK_DIR: ${STACK_DIR:-/home/ich/matrix-agora}   # v3.4: compose for a start lives at $STACK_DIR/server
      COMPOSE_PROJECT: server
    user: "1000:1000"
    group_add: ["${DOCKER_GID:-999}"]            # the host's docker group: the socket is root:docker 0660
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../state:/app/state                      # v3.4: read-write for "forget" (state/<name>.memory.md only)
      - ../claude-workspace:/claude-workspace    # v4.7: Claude's folder — list, read, download, upload, delete
      - /etc/os-release:/host/os-release:ro
      # the stack at its HOST path: compose resolves ../state etc. on this side, the daemon mounts them on the host
      - ${STACK_DIR:-/home/ich/matrix-agora}/server:${STACK_DIR:-/home/ich/matrix-agora}/server:ro

volumes:
  db:

# deploy-loop proven: v0.2 (AGORA-004)
