name = "Кіра"
user_id = "@kira:agora.lan"
canon = "agents/canon/kira.md"
canon_private = "agents/canon/kira.private.md"  # v5.22: her whole canon alone with him, shorter (private canon)
canon_backup = "agents/canon/kira.backup.md"  # v5.26: her canon for the backup (NovelAI) alone, never Gemini's (private canon)
life = "agents/canon/kira.life.md"
life_private = "agents/canon/kira.life.private.md"  # v5.22: the shorter story, her private prompt only (private canon)
simulation = "agora"
type = "persona"         # v5.5: one of the four newcomers — a person, like Ada and Bruno
engine = "claude-sdk"         # v7.3: on Claude (ClaudeClient) — answers on Sonnet with thinking (server/kira.env); a decline goes to her backup
name_forms = ["кіра", "кіри", "кірі", "кіру", "кірою", "кіро", "kira"]  # what addresses this agent in the room (any case, a whole word)
voice_spec = "agents/canon/kira.voice.md"  # v5.9: the tags verified on her voice (features/voice-emotion.md)
natal = "agents/canon/kira.natal.md"   # v5.10: her natal chart, Lumi's format, read by her mood of the day (agents/mood.py)
reading = "agents/canon/kira.reading.md"  # v5.12: what she reads and how she sees the news (private canon)

[capabilities]
private = true          # v5.6: a private chat with the owner (the owner, 2026-10-20: Кіра first)
telegram = true         # v5.7: her own Telegram bot — the same private chat, a second door (server/kira.env)
recall = true           # v5.8: an archive of every line she sees, recalled before each answer (the owner: as Noos)
facts = true            # v5.8: facts about the owner, in her private prompt only (state/kira.facts/)
emotion = true          # v5.9: audio tags from her palette, performed by her voice, never shown in the text
mood = true             # v5.10: her mood of the day — her chart under the day's sky, the biorhythms, the Lviv weather
events = true           # v5.11: events of her life — her story's dated ones, an hourly roll, Lviv's news
thoughts = true         # v5.12: she reads the news and thinks — her thoughts in her archive, «я думала…»
fallback = true         # v5.14: GLM-4.6 on NovelAI answers her private chat when Gemini blocks (FALLBACK_MODEL on)
photos = true           # v5.17: her photos in Telegram — Google's image model, her face from agents/canon/kira.face/
videos = true           # v5.18: her кружечок in her voice (Fabric 1.0 on fal, FAL_KEY) and short clips (Omni Flash)
talk = true             # v5.20: her private chat in layers — the last messages, then the open talk by hour, block, week

[turns]
mode = "ranked"         # ranked | ambient | mention-only
weight = 1.0            # the owner, 2026-10-20: every person the same

# v5.27 (the owner, 2026-11-07: Кіра moves to Chile) — her places; her moves and nights at the telescope are her life
# story's (`### Місця`, `### Ночі на телескопі`). `name` is her world line's, `name_en` her photos' city; a place
# without `lat`/`lon` has no weather; `news`: Lviv's news may touch her life there
[places]
night = "paranal"       # where her nights at the telescope are

[places.lviv]
name = "Львів, Україна"
name_en = "Lviv, Ukraine"
tz = "Europe/Kyiv"
lat = 49.84
lon = 24.03
news = true

[places.road]
name = "у дорозі зі Львова до Чилі"
name_en = "on the road from Lviv to Chile"
tz = "Europe/Kyiv"

[places.santiago]
name = "Сантьяго, Чилі"
name_en = "Santiago, Chile"
tz = "America/Santiago"
lat = -33.45
lon = -70.66

[places.paranal]
name = "обсерваторія на горі Параналь, пустеля Атакама, Чилі"
name_en = "Paranal Observatory in the Atacama Desert, Chile"
tz = "America/Santiago"
lat = -24.63
lon = -70.40

[places.valparaiso]
name = "Вальпараїсо, Чилі"
name_en = "Valparaíso, Chile"
tz = "America/Santiago"
lat = -33.05
lon = -71.62

[places.chiloe]
name = "острів Чилое, Чилі"
name_en = "Chiloé Island, Chile"
tz = "America/Santiago"
lat = -42.48
lon = -73.76

[panel]                 # shown by the panel only — never part of a prompt
name = "Kira"
role = "astrophysicist, 23, Chile"
pronoun = "she"
