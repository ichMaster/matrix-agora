name = "Кіра"
user_id = "@kira:agora.lan"
canon = "agents/canon/kira.md"
life = "agents/canon/kira.life.md"
simulation = "agora"
type = "persona"         # v5.5: one of the four newcomers — a person, like Ada and Bruno
engine = "gemini"
name_forms = ["кіра", "кіри", "кірі", "кіру", "кірою", "кіро", "kira"]  # what addresses this agent in the room (any case, a whole word)
voice_spec = "agents/canon/kira.voice.md"  # v5.9: the tags verified on her voice (features/voice-emotion.md)
natal = "agents/canon/kira.natal.md"   # v5.10: her natal chart, Lumi's format, read by her mood of the day (agents/mood.py)
reading = "agents/canon/kira.reading.md"  # v5.12: what she reads and how she sees the news (private canon)

[capabilities]
private = true          # v5.6: a private chat with the owner (the owner, 2026-10-20: Кіра first)
telegram = true         # v5.7: her own Telegram bot — the same private chat, a second door (server/kira.env)
recall = true           # v5.8: an archive of every line she sees, recalled before each answer (the owner: as Noos)
facts = true            # v5.8: facts about the owner, in her private prompt only (state/kira.facts/)
emotion = true          # v5.9: audio tags from her palette, performed by her voice, never shown in the text
mood = true             # v5.10: her mood of the day — her chart under the day's sky, the biorhythms, the Lviv weather
events = true           # v5.11: events of her life — her story's dated ones, an hourly roll, Lviv's news
thoughts = true         # v5.12: she reads the news and thinks — her thoughts in her archive, «я думала…»
fallback = true         # v5.14: GLM-4.6 on NovelAI answers her private chat when Gemini blocks (FALLBACK_MODEL on)
photos = true           # v5.17: her photos in Telegram — Google's image model, her face from agents/canon/kira.face/

[turns]
mode = "ranked"         # ranked | ambient | mention-only
weight = 1.0            # the owner, 2026-10-20: every person the same

[panel]                 # shown by the panel only — never part of a prompt
name = "Kira"
role = "astrophysicist, 23, Lviv"
pronoun = "she"
